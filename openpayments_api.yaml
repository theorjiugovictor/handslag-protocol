    isoCountryCodes:
      description: Comma-separated array of ISO country codes.
      type: array
      items:
        type: string
      example: SE,UK,FI
    aspspList:
      description: List of ASPSPs
      type: object
      properties:
        aspsps:
          type: array
          items:
            $ref: '#/components/schemas/aspspListItem'
    aspsp:
      description: ASPSP
      type: object
      properties:
        bicFi:
          pattern: ^[A-Z]{6,6}[A-Z2-9][A-NP-Z0-9]([A-Z0-9]{3,3}){0,1}$
          type: string
        name:
          maxLength: 140
          type: string
        logoUrl:
          type: string
        city:
          type: string
        country:
          type: string
        postalCode:
          maxLength: 20
          type: string
        streetAddress:
          maxLength: 140
          type: string
        companyNumber:
          type: string
        phone:
          type: string
        websiteUrl:
          type: string
        globalPaymentProducts:
          description: Payment products supported by the ASPSP.
          type: array
          items:
            type: string
        supportedAuthorizationMethods:
          $ref: '#/components/schemas/supportedAuthorizationMethods'
        affiliatedAspsps:
          $ref: '#/components/schemas/affiliatedAspsps'
        accountInformation:
          $ref: '#/components/schemas/accountInformationCapabilities'
        paymentInitiation:
          $ref: '#/components/schemas/paymentInitiationCapabilities'
    accountInformationCapabilities:
      description: Capabilities and constraints related to account information access.
      type: object
      properties:
        transactionHistoryMaxDays:
          description: Maximum number of days of standard transaction history available if limited by the ASPSP.
          type: integer
          format: int32
          example: 90
        extendedTransactionHistoryMaxDays:
          description: Maximum days of extended transaction history available after consent authorisation if supported by the ASPSP. 
          type: integer
          format: int32
          example: 760
        extendedTransactionHistoryAvailableWindowMinutes:
          description: Time window in minutes during which extended transaction history remains available after consent authorisation.
          type: integer
          format: int32
          example: 5
        transactionHistoryMaxCount:
          description: Maximum number of historical transactions available if limited by the ASPSP. 
          type: integer
          format: int32
          example: 1000
    paymentInitiationCapabilities:
      description: Capabilities and constraints related to payment initiation.
      type: object
      required:
        - signingBasketsSupported
      properties:
        signingBasketsSupported:
          description: Indicates whether signing baskets are supported by the ASPSP.
          type: boolean
          example: true
        signingBasketLimit:
          description: Maximum number of `paymentIds` allowed in a signing basket if supported by the ASPSP.
          type: integer
          format: int32
          example: 100
    supportedAuthorizationMethods:
      description: Authorization methods supported by the ASPSP.
      type: array
