openapi: 3.0.1
info:
  title: Open Payments API
  version: 1.3.3
  description: >
    # Summary

    The Open Banking part of our API is based on The BerlinGroup NextGenPSD2 Framework with some additional services.

    For information on using these API's, please refer to our documentation.

    ## Some General Remarks Related to this version of the OpenAPI Specification:

    * According to the OpenAPI-Specification
    [https://github.com/OAI/OpenAPI-Specification/blob/master/versions/3.0.1.md]
        "If in is "header" and the name field is "Accept", "Content-Type" or "Authorization", the parameter definition SHALL be ignored."
      The element "Accept" will not be defined in this file at any place.
      The elements "Content-Type" and "Authorization" are implicitly defined by the OpenApi tags "content" and "security".

  license:
    name: Creative Commons Attribution 4.0 International Public License
    url: https://creativecommons.org/licenses/by/4.0/
  contact:
    name: Open Payments Europe AB
    url: https://www.openpayments.io/
    email: info@openpayments.io
externalDocs:
  description: >
    Full Documentation of NextGenPSD2 Access to Account Interoperability
    Framework

    (General Introduction Paper, Operational Rules, Implementation Guidelines)
  url: https://www.berlin-group.org/nextgenpsd2-downloads

servers:
  - url: https://api.openbankingplatform.com
  - url: https://api.sandbox.openbankingplatform.com

paths:
  /premium/v1/payee-verifications:
    servers:
      - url: https://api.sandbox.openbankingplatform.com
        description: Premium products sandbox server
      - url: https://api.openbankingplatform.com
        description: Premium products production server
    post:
      summary: Submit Verification Request
      description: Returns a VoP result based on a creditor's name and IBAN.
      tags:
        - Verification of Payee (VoP)
      operationId: Submit Verification of Payee
      security:
        - oAuth2Sandbox:
          - paymentinitiation corporate
        - oAuth2Production:
          - paymentinitiation corporate
      parameters:
        - $ref: '#/components/parameters/X-Request-ID'
        - $ref: '#/components/parameters/PSU-ID'
        - $ref: '#/components/parameters/PSU-Corporate-ID'
      requestBody:
        $ref: '#/components/requestBodies/verificationOfPayee'
      responses:
        '200':
          $ref: '#/components/responses/OK_200_VerificationOfPayee'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDetails'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDetails'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDetails'
  /premium/v1/bulk-payee-verifications:
    servers:
      - url: https://api.sandbox.openbankingplatform.com
        description: Premium products sandbox server
      - url: https://api.openbankingplatform.com
        description: Premium products production server
    post:
      summary: Submit Bulk Verification Request
      description: Returns VoP results for multiple creditors. 
      tags:
        - Verification of Payee (VoP)
      operationId: Submit Bulk Verification of Payee
      security:
        - oAuth2Sandbox:
          - paymentinitiation corporate
        - oAuth2Production:
          - paymentinitiation corporate
      parameters:
        - $ref: '#/components/parameters/X-Request-ID'
        - $ref: '#/components/parameters/PSU-ID'
        - $ref: '#/components/parameters/PSU-Corporate-ID'
      requestBody:
        $ref: '#/components/requestBodies/bulkVerificationOfPayee'
      responses:
        '200':
          $ref: '#/components/responses/OK_200_BulkVerificationOfPayee'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDetails'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDetails'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDetails'
        description: Returns VoP results 
  /premium/v1/creditor-name:
    servers:
      - url: https://api.sandbox.openbankingplatform.com
        description: Premium products sandbox server
      - url: https://api.openbankingplatform.com
        description: Premium products production server
    get:
      summary: Get Creditor Name
      description: Returns the name of the recipient based on their account information. 
      tags:
        - Bankgiro Lookup
      operationId: Get Creditor Name
      security:
        - oAuth2Sandbox:
          - paymentinitiation corporate
        - oAuth2Production:
          - paymentinitiation corporate
      parameters:
        - name: giroNumber
          in: query
          required: true
          schema:
            type: string
        - name: giroType
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/giroType'
        - name: ocrRef
          in: query
          description: |
            **Must** be provided if `invoiceRef` is not.
          schema:
            $ref: '#/components/schemas/giroOcrReference'
        - name: invoiceRef
          in: query
          description: |
            **Must** be provided if `ocrRef` is not.
          schema:
            $ref: '#/components/schemas/giroInvoiceReference'
        - $ref: '#/components/parameters/X-Request-ID'
        - $ref: '#/components/parameters/PSU-Corporate-ID'
        - $ref: '#/components/parameters/PSU-ID'
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetCreditorNameResponse'
              examples:
                Example:
                  $ref: '#/components/examples/GetCreditorNameResponseExample'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDetails'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDetails'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDetails'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDetails'
  /premium/v1/giro-numbers:
    servers:
      - url: https://api.sandbox.openbankingplatform.com
        description: Premium products sandbox server
      - url: https://api.openbankingplatform.com
        description: Premium products production server
    get:
      summary: Get Giro Numbers
      description: Returns Bankgiro numbers associated with a company.
      tags:
        - Bankgiro Lookup
      operationId: Get Giro Numbers
      security:
        - oAuth2Sandbox:
          - paymentinitiation corporate
        - oAuth2Production:
          - paymentinitiation corporate
      parameters:
        - name: psuCorporateId
          in: query
          required: true
          schema:
            type: string
        - name: giroType
          in: query
          schema:
            $ref: '#/components/schemas/giroType'
        - $ref: '#/components/parameters/X-Request-ID'
        - $ref: '#/components/parameters/PSU-Corporate-ID'
        - $ref: '#/components/parameters/PSU-ID'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetGiroNumbersResponse'
              examples:
                Example:
                  $ref: '#/components/examples/GetGiroNumbersResponseExample'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDetails'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDetails'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDetails'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDetails'
  /iso/payments:
    servers:
      - url: https://api.sandbox.openbankingplatform.com
        description: ISO sandbox server
      - url: https://api.openbankingplatform.com
        description: ISO production server
    post:
      tags:
        - ISO Payments
      operationId: Create Payment
      summary: Create Payment
      description: Initiates an ISO payment by submitting the required payment instructions. 
      security:
        - oAuth2Sandbox:
          - paymentinitiation corporate
        - oAuth2Production:
          - paymentinitiation corporate
      parameters:
        - $ref: '#/components/parameters/X-Request-ID'
        - $ref: '#/components/parameters/X-BicFi'
        - $ref: '#/components/parameters/X-AffiliatedASPSP-ID'
        - $ref: '#/components/parameters/PSU-ID'
        - $ref: '#/components/parameters/PSU-Corporate-ID'
        - $ref: '#/components/parameters/consentId_HEADER_optional'
        - $ref: '#/components/parameters/PSU-IP-Address_mandatory'
        - $ref: '#/components/parameters/PSU-User-Agent_mandatory'

      requestBody:
        $ref: '#/components/requestBodies/isoPaymentInitiation'
      responses:
        '201':
          $ref: '#/components/responses/CREATED_201_IsoPaymentInitiation'
        '400':
          $ref: '#/components/responses/BAD_REQUEST_400_PIS'
  /iso/payments/cross-border:
    servers:
      - url: https://api.sandbox.openbankingplatform.com
        description: ISO sandbox server
      - url: https://api.openbankingplatform.com
        description: ISO production server
    post:
      tags:
        - ISO Payments
      operationId: Create Payment (Cross-border)
      summary: Create Payment (Cross-border)
      description: Initiates an ISO payment by submitting cross-border payment instructions.
      security:
        - oAuth2Sandbox:
          - paymentinitiation corporate
        - oAuth2Production:
          - paymentinitiation corporate
      parameters:
        - $ref: '#/components/parameters/X-Request-ID'
        - $ref: '#/components/parameters/X-BicFi'
        - $ref: '#/components/parameters/X-AffiliatedASPSP-ID'
        - $ref: '#/components/parameters/PSU-ID'
        - $ref: '#/components/parameters/PSU-Corporate-ID'
        - $ref: '#/components/parameters/PSU-Corporate-ID-Type'
        - $ref: '#/components/parameters/consentId_HEADER_optional'
        - $ref: '#/components/parameters/PSU-IP-Address_mandatory'
        - $ref: '#/components/parameters/PSU-User-Agent_mandatory'
        - $ref: '#/components/parameters/FX-Quote-Id_mandatory'
      requestBody:
        $ref: '#/components/requestBodies/isoPaymentInitiationCrossBorder'
      responses:
        '201':
          $ref: '#/components/responses/CREATED_201_IsoPaymentInitiation'
        '400':
          $ref: '#/components/responses/BAD_REQUEST_400_PIS'
  /iso/beta/payments/sepa-direct-debit:
    servers:
      - url: https://api.openbankingplatform.com
        description: Premium products production server
    post:
      tags:
        - SEPA Direct Debit
      operationId: Create SEPA Direct Debit Payment
      summary: Create SEPA Direct Debit Payment (Beta)
      description: Initiates a SEPA Direct Debit payment by submitting direct debit payment instructions via ISO.
      security:
        - oAuth2Production:
          - paymentinitiation corporate
      parameters:
        - $ref: '#/components/parameters/X-Request-ID'
        - $ref: '#/components/parameters/X-BicFi'
        - $ref: '#/components/parameters/X-AffiliatedASPSP-ID'
        - $ref: '#/components/parameters/PSU-ID'
        - $ref: '#/components/parameters/PSU-Corporate-ID'
        - $ref: '#/components/parameters/PSU-Corporate-ID-Type'
        - $ref: '#/components/parameters/consentId_HEADER_optional'
        - $ref: '#/components/parameters/PSU-IP-Address_mandatory'
        - $ref: '#/components/parameters/PSU-User-Agent_mandatory'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/paymentInitiationSepaDirectDebit_json'
      responses:
        '201':
          $ref: '#/components/responses/CREATED_201_PaymentInitiation'
        '400':
          $ref: '#/components/responses/BAD_REQUEST_400_PIS'
  /iso/payments/{paymentId}:
    servers:
      - url: https://api.sandbox.openbankingplatform.com
        description: ISO sandbox server
      - url: https://api.openbankingplatform.com
        description: ISO production server
    get:
      tags:
        - ISO Payments
        - SEPA Direct Debit
      operationId: Get Payment
      security:
        - oAuth2Sandbox:
          - paymentinitiation corporate
        - oAuth2Production:
          - paymentinitiation corporate
      summary: Get Payment
      description: Retrieves the details and status of an ISO payment.
      parameters:
        - $ref: '#/components/parameters/paymentId'
        - $ref: '#/components/parameters/X-Request-ID'
        - $ref: '#/components/parameters/X-BicFi'
        - $ref: '#/components/parameters/X-AffiliatedASPSP-ID'
        - $ref: '#/components/parameters/PSU-ID'
        - $ref: '#/components/parameters/PSU-Corporate-ID'
        - $ref: '#/components/parameters/PSU-Corporate-ID-Type'
        - $ref: '#/components/parameters/consentId_HEADER_optional'
        - $ref: '#/components/parameters/PSU-IP-Address_mandatory'
        - $ref: '#/components/parameters/PSU-User-Agent_mandatory'
        - $ref: '#/components/parameters/FX-Quote-Id'
      responses:
        '200':
          $ref: '#/components/responses/OK_200_PaymentInitiationInformation'
        '400':
          $ref: '#/components/responses/BAD_REQUEST_400_PIS'
  /iso/payments/confirm:
    servers:
      - url: https://api.sandbox.openbankingplatform.com
        description: ISO sandbox server
      - url: https://api.openbankingplatform.com
        description: ISO production server
    put:
      tags:
        - ISO Payments
        - SEPA Direct Debit
      operationId: Confirm Payment
      summary: Confirm Payment
      description: Confirms and finalizes a pending ISO payment and sends it for processing. Only confirmed payments are transmitted to the clearing system for execution. 
      security:
        - oAuth2Sandbox:
          - paymentinitiation corporate
        - oAuth2Production:
          - paymentinitiation corporate
      parameters:
        - $ref: '#/components/parameters/X-Request-ID'
        - $ref: '#/components/parameters/X-BicFi'
        - $ref: '#/components/parameters/X-AffiliatedASPSP-ID'
        - $ref: '#/components/parameters/PSU-ID'
        - $ref: '#/components/parameters/PSU-Corporate-ID'
        - $ref: '#/components/parameters/PSU-Corporate-ID-Type'
        - $ref: '#/components/parameters/consentId_HEADER_optional'
        - $ref: '#/components/parameters/PSU-IP-Address_mandatory'
        - $ref: '#/components/parameters/PSU-User-Agent_mandatory'


      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmIsoPaymentRequest'
            examples:
              Example:
                $ref: '#/components/examples/ConfirmIsoPaymentRequestExample'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfirmIsoPaymentResponse'
              examples:
                Example:
                  $ref: '#/components/examples/ConfirmIsoPaymentResponseExample'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDetails'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDetails'
  /premium/v1/payouts:
    servers:
      - url: https://api.openbankingplatform.com
        description: Premium products production server
    post:
      tags:
        - Payout Service
      operationId: Create Payout
      security:
        - oAuth2Production:
          - paymentinitiation corporate
      summary: Create Payout
      description: Initiates a payout request by submitting payment details.
      parameters:
        - $ref: '#/components/parameters/X-Request-ID'
        - $ref: '#/components/parameters/PSU-Corporate-ID'
        - $ref: '#/components/parameters/PSU-ID'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePayoutRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatePayoutResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDetails'
  /premium/v1/payouts/{payoutId}:
    servers:
      - url: https://api.openbankingplatform.com
        description: Premium products production server
    get:
      tags:
        - Payout Service
      operationId: Get Payout
      security:
        - oAuth2Production:
          - paymentinitiation corporate
      summary: Get Payout
      description: Returns the details and current status of a payout. 
      parameters:
        - name: payoutId
          description: ID of the generated payout resource.
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/X-Request-ID'
        - $ref: '#/components/parameters/PSU-Corporate-ID'
        - $ref: '#/components/parameters/PSU-ID'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetPayoutResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDetails'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDetails'
  /premium/v1/payouts/confirm:
    servers:
      - url: https://api.openbankingplatform.com
        description: Premium products production server
    put:
      tags:
        - Payout Service
      operationId: Confirm Payout
      security:
        - oAuth2Production:
          - paymentinitiation corporate
      summary: Confirm Payout
      description: Confirms and finalizes a pending payout, triggering the disbursement of funds. Only confirmed payouts are sent to Bankgirot for processing.
      parameters:
        - $ref: '#/components/parameters/X-Request-ID'
        - $ref: '#/components/parameters/PSU-Corporate-ID'
        - $ref: '#/components/parameters/PSU-ID'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmPayoutRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfirmPayoutResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDetails'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDetails'
  /v1/bulk-payment:
    servers:
      - url: https://bulkpayment.openbankingplatform.com
        description: Bulk payment production server
    post:
      tags:
        - Bulk Payments
      summary: Create bulk payment
      description: Creates a bulk payment resource by parsing the XML contents in the posted body.
      parameters:
        - name: X-Request-ID
          in: header
          description: "Type: string (uuid)<br />\r\nDescription: ID of the request, unique to the call, as determined by the initiating party."
          required: true
          schema:
            type: string
          example: b81b5960-306d-449b-b375-eeec8d464511
        - name: X-Corporate-ID
          in: header
          description: "Type: string<br />\r\nDescription: Swedish 10 digit corporate organisation number."
          required: true
          schema:
            type: string
          example: '5524438362'
        - name: X-PaymentExecutionAdjustmentDays
          in: header
          description: "Type: integer<br />\r\nDescription: Number of valid bankdays to adjust payment execution day given in XML (positive or negative integer)."
          schema:
            type: string
          example: '1'
      requestBody:
        description: Bulk payment structure in JSON or ISO 20022 PAIN.001.001 XML format
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBulkPayment'
            example:
              bicFi: SWEDSESS
              numberOfTransactions: 2
              controlSum: 323.15
              domestic:
                - debtorAccount:
                    iban: SE4550000000058398257466
                  instructedAmount:
                    currency: SEK
                    amount: 123.05
                  creditorName: Acme AB
                  creditorAccount:
                    iban: SE1412000000000012345678
                  requestedExecutionDate: '2022-09-02'
                  remittanceInformationUnstructured: Invoice 1
              swedishGiro:
                - debtorAccount:
                    iban: SE4550000000058398257466
                  instructedAmount:
                    currency: SEK
                    amount: 200.1
                  creditorName: Acme AB
                  creditorGiro:
                    giroType: BANKGIRO
                    giroNumber: '1234-5678'
                  requestedExecutionDate: '2022-09-03'
                  invoiceRef: Invoice 1
          application/xml:
            schema:
              $ref: '#/components/schemas/XElement'
      responses:
        '201':
          description: "Created<br />\r\nThe resource was successfully created"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateBulkPaymentOutput'
              example:
                bulkPaymentId: 6aa69579-fb15-421c-8c53-ddb778156f83
                status: valid
                latestAuthorisationDate: '2022-01-18'
                adjustedPaymentExecutionDate: '2022-01-23'
                numberOfAuthorisations: 1
                redirectUri: >-
                  https://openlink.openbankingplatform.com/approve-payment?context=612f3476-37d5-4ef3-8803-9cb67448810c&client_id=[CLIENT_ID]&redirect_uri=[REDIRECT_URI]&state=[STATE]&profile=default-sv&authoriser_ref=[AUTHORISER_REF]
        '400':
          description: "Bad Request<br />\r\nBulk payment input data invalid<br /><br />\r\n\"detail\" property may report the following errors:\r\n- \"Invalid organisation id ({organisationId})\"\r\n- \"Number of payment transactions ({countedPaymentTrns}) does not match with declared ({paymentNumTrns})\"\r\n- \"Invalid transaction amount ({trnsAmount})\"\r\n- \"Invalid BicFi ({bicFi})\"\r\n- \"Invalid payment execution date (PmtInf.ReqdExctnDt). {paymentExecutionDate} is a bank holiday.\"\r\n- \"Payment execution date (PmtInf.ReqdExctnDt) must be at least {n} banking days away.\"\r\n- \"Sum of transaction amounts ({totalTrnsSum}) does not match with declared control sum ({headerControlSum})\"\r\n- \"No transactions defined\"\r\n- \"Total number of transactions ({countedTrns}) does not match with declared ({headerNumTrns})\"\r\n- \"Payment BBAN or IBAN creditor account number not found\"\r\n- \"Invalid creditor name\"\r\n- \"Invalid IBAN debtor account number {accountNumber}\"\r\n- \"Invalid BBAN creditor account clearing number {clearingNumber}\"\r\n- \"Invalid BBAN creditor account number {accountNumber}\"\r\n- \"Invalid IBAN creditor account number {accountNumber}\"\r\n- \"ISO payment creation failed, code: {code} text: {text}\""
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: "Unauthorised<br />\r\nAccess was not allowed"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/bulk-payment/{bulkPaymentId}/status:
    servers:
      - url: https://bulkpayment.openbankingplatform.com
        description: Bulk payment production server
    get:
      tags:
        - Bulk Payments
      summary: Get status of bulk payment and each of the included payments.
      description: Returns the status of the bulk payment resource and each included payment.
      parameters:
        - name: X-Request-ID
          in: header
          description: ID of the request, unique to the call, as determined by the initiating party.
          required: true
          schema:
            type: string
          example: 0926b69c-42f0-44d8-83d8-f458fa40c83f
        - name: bulkPaymentId
          in: path
          description: ID of the generated bulk payment resource.
          required: true
          schema:
            type: string
            format: uuid
          example: 6aa69579-fb15-421c-8c53-ddb778156f83
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkPaymentStatus'
              example:
                bulkPaymentId: 6aa69579-fb15-421c-8c53-ddb778156f83
                status: valid
                statusTime: '2022-02-05T13:05:53.334'
                payments:
                  - referenceId: SALA 202112 1
                    status: received
                    statusTime: '2022-02-05T13:05:53.334'
                  - referenceId: SALA 202112 2
                    status: received
                    statusTime: '2022-02-05T13:05:53.334'
                  - referenceId: SALA 202112 3
                    status: received
                    statusTime: '2022-02-05T13:05:53.334'
        '401':
          description: "Unauthorised<br />\r\nAccess was not allowed"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: "Not Found<br />\r\nThe requested resource was not found"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/bulk-payment/{bulkPaymentId}:
    servers:
      - url: https://bulkpayment.openbankingplatform.com
        description: Bulk payment production server
    delete:
      tags:
        - Bulk Payments
      summary: Cancel bulk payment and each of the included payments.
      description: "Cancels the bulk payment and each included payment."
      parameters:
        - name: X-Request-ID
          in: header
          description: "Type: string (uuid)<br />\r\nDescription: ID of the request, unique to the call, as determined by the initiating party."
          required: true
          schema:
            type: string
          example: b81b5960-306d-449b-b375-eeec8d464511
        - name: bulkPaymentId
          in: path
          description: "Type: string (uuid)<br />\r\nDescription: Bulk payment resource id."
          required: true
          schema:
            type: string
            format: uuid
          example: 6aa69579-fb15-421c-8c53-ddb778156f83
      responses:
        '204':
          description: "No Content<br />\r\nThe resource was successfully cancelled"
        '401':
          description: "Unauthorised<br />\r\nAccess was not allowed"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: "Forbidden<br />\r\nAccess to resource or resource operation was not allowed"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: "Not Found<br />\r\nThe requested resource was not found"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
