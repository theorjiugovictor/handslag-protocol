        bankTransactionCode:
          $ref: '#/components/schemas/bankTransactionCode'
        proprietaryBankTransactionCode:
          $ref: '#/components/schemas/proprietaryBankTransactionCode'
        transactionListId:
          $ref: '#/components/schemas/transactionListId'
        paymentId:
          $ref: '#/components/schemas/transactionPaymentId'
        isEnriched:
          $ref: '#/components/schemas/isEnriched'
        _links:
          $ref: '#/components/schemas/_linksTransactionDetails'
        transactionFees:
          $ref: '#/components/schemas/transactionFees'
        tppMessages:
          type: array
          items:
            $ref: '#/components/schemas/tppMessage2XX'
    cardTransaction:
