security:
  - {}
tags:
  - name: ASPSP Information Service
    description: |
      The ASPSP (Account Servicing Payment Service Providers) Information Service allows looking up information about banks and other account providers.
      The service offers the following services:
        * List All ASPSPs in a specific country
        * List all ASPSPs connected to the Open Banking Platform
        * Details about the ASPSP
  - name: Consent Service
    description: |
      The Consent Service offers the following services:
      * Create and authorize consents between the PSU and the TPP for use in the AIS services
      * Get status of consent and retrieve previously authorized consents
  - name: Account Information Service (AIS)
    description: |
      The Account Information Service (AIS) offers the following services:
        * Transaction reports for a given account or card account including balances if applicable
        * Balances of a given account or card account
        * A list of available accounts or card account
        * Account details of a given account or card account or of the list of all accessable accounts or card account  relative to a granted consent
  - name: Payment Initiation Service (PIS)
    description: |
      Payment Initiation Service (PIS) offers the following services:
        * Create and authorize payments
        * Status information of payments and authorizations
        * Create and authorize baskets to efficiently sign multiple payments in one authorization
        * Cancel previously signed payments
        * Retrieve and create currency exchange (FX) quotes for cross-border transfers
  - name: KYC Service
    description: |-
      KYC Service offers the following services:
        * Initiation of a KYC process to access our KYC webform 
        * KYC status of a corporation
  - name: ISO Payments
    description: >-
      ISO Payments offers a direct and intuitive interface to the banks
      ISO 20022 products. By leveraging ISO 20022, you can automate and streamline
      a wide range of payment processes, including both domestic and
      international vendor payments and payroll.
  - name: Bulk Payments
    description: |
      Bulk Payments offers the following services:
        * Initiation and update of a payment request
        * Status information of a payment
  - name: Payout Service
    description: >-
      The Payout Service brings efficiency and security to a wide range of
      payment processes, including supplier invoices, payroll, refunds, and
      other forms of disbursement. The solution automates the entire workflow,
      minimizing manual errors while eliminating transaction limits and the need
      for manual banking procedures. Funds are first placed in our dedicated
      client account before final disbursement, providing an added layer of
      security and stability and enabling seamless integration with the national
      clearing system Bankgirot.
  - name: FX Connect
    description: >-
      FX Connect enables you to execute cross-border payments without integrating
      the Payment Initiation Service (PIS), operating seamlessly on top of your own existing bank integrations.
      With FX Connect, you can provide your users with real-time, transparent institutional FX rates for spot and forward transactions, 
      together with automated cross-border settlement — while continuing to use your platform's own bank connections to initiate payments.
  - name: Bankgiro Lookup
    description: >-
      Bankgiro Lookup APIs provide enhanced data and pre-payment validation on top of our core APIs. 
      These services enable you to build more reliable, user-friendly payment experiences by accessing and verifying additional information related to payment accounts. 
  - name: Verification of Payee (VoP)
    description: >-
      The Verification of Payee (VoP) API allows you to instantly verify that a creditor's name matches the provided account details (IBAN) and display the result to your PSU, e.g. when they create a new supplier card in your system.
      With this API, you can provide enhanced security for your PSU's financial operations by reducing the risk of fraud and misdirected payments. 
  - name: SEPA Direct Debit 
    description: >-
      The SEPA Direct Debit API allows you to initiate EUR-denominated collections directly from your customer's bank account in the Netherlands by submitting debit instructions in JSON format,
      from which an ISO 20022 pain.008 file is generated and sent to the debtor's bank under a valid mandate.
