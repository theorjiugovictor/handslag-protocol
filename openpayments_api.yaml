        proprietaryBankTransactionCode:
          $ref: '#/components/schemas/proprietaryBankTransactionCode'
    reportExchangeRateList:
      description: Array of exchange rates
      type: array
      items:
        $ref: '#/components/schemas/reportExchangeRate'
    reportExchangeRate:
      description: Exchange Rate
      type: object
      required:
        - sourceCurrency
        - exchangeRate
        - unitCurrency
        - targetCurrency
        - quotationDate
      properties:
        sourceCurrency:
          $ref: '#/components/schemas/currencyCode'
        exchangeRate:
          type: string
        unitCurrency:
          type: string
        targetCurrency:
          $ref: '#/components/schemas/currencyCode'
        quotationDate:
          type: string
          format: date
        contractIdentification:
          type: string
    paymentExchangeRate:
      description: Exchange Rate
      type: object
      properties:
        unitCurrency:
          type: string
        exchangeRate:
          type: string
        contractIdentification:
          type: string
        rateType:
          type: string
          enum:
            - SPOT
            - SALE
            - AGRD
    balance:
      description: |
        A single balance element
      type: object
      required:
        - balanceAmount
        - balanceType
      properties:
        balanceAmount:
          $ref: '#/components/schemas/amount'
        balanceType:
          $ref: '#/components/schemas/balanceType'
        creditLimitIncluded:
          description: |
            A flag indicating if the credit limit of the corresponding account 
            is included in the calculation of the balance, where applicable.
          type: boolean
          example: false
        lastChangeDateTime:
          description: >
            Might be used to indicate when the balance was last updated.
          type: string
          format: date-time
        referenceDate:
          description: Reference date of the balance.
          type: string
          format: date
        lastCommittedTransaction:
          description: >
            "entryReference" of the last committed transaction.
          type: string
          maxLength: 35
        clearingNumber:
          $ref: '#/components/schemas/clearingNumber'
    balanceList:
      description: >
        A list of balances for the account. This list might be restricted to the current balance.
      type: array
      items:
        $ref: '#/components/schemas/balance'
    cancellationList:
      required:
        - cancellationIds
      description: An array of all cancellationIds connected to this resource.
      type: object
      properties:
        cancellationIds: 
          type: array
          items:
            $ref: '#/components/schemas/cancellationId'
    bicfi:
      description: |
        BICFI
      type: string
      pattern: '[A-Z]{6,6}[A-Z2-9][A-NP-Z0-9]([A-Z0-9]{3,3}){0,1}'
      example: AAAADEBBXXX
    pan:
      description: |
        Primary Account Number according to ISO/IEC 7812.
      type: string
      maxLength: 35
      example: '5409050000000000'
    maskedPan:
      description: |
        Masked Primary Account Number.
      type: string
      maxLength: 35
      example: 123456xxxxxx1234
    ownerName:
      description: >
        Name of the legal account owner. 

        If there is more than one owner, then e.g. two names might be noted
        here.


        For a corporate account, the corporate name is used for this attribute.

        Even if supported by the ASPSP, the provision of this field might depend
        on the fact whether an explicit consent to this specific additional
        account information has been given by the PSU.
      type: string
      maxLength: 140
      example: John Doe
    debitAccounting:
      description: >
        If true, the amounts of debits on the reports are quoted positive with
        the related consequence for balances.

        If false, the amount of debits on the reports are quoted negative.
      type: boolean
    displayName:
      description: |
        Name of the account as defined by the PSU within online channels.
      type: string
      maxLength: 70
    bban:
      description: |
        Basic Bank Account Number (BBAN) Identifier. Used nationally by financial institutions, i.e., in individual countries, 
          generally as part of a National Account Numbering Scheme(s), 
          which uniquely identifies the account of a customer.
      type: string
      pattern: '[a-zA-Z0-9]{1,30}'
      example: BARC12345612345678
    msisdn:
      type: string
      maxLength: 35
      description: Mobile phone number.
      example: +49 170 1234567
    iban:
      type: string
      description: International Bank Account Number (IBAN) of an account.
      pattern: '[A-Z]{2,2}[0-9]{2,2}[a-zA-Z0-9]{1,30}'
      example: FR7612345987650123456789014
    giroNumber:
      type: string
      description: Swedish Bankgiro or Plusgiro number
      pattern: '[0-9-]{5,35}'
      example: 1234-5678
    giroType:
      type: string
      description: Swedish giro type
      enum:
        - BANKGIRO
        - PLUSGIRO
    bankGiroNumber:
      type: string
      description: Swedish Bankgiro number
      pattern: '[0-9-]{5,35}'
      example: 1234-5678
    plusGiroNumber:
      type: string
      description: Swedish Plusgiro number
      pattern: '[0-9-]{5,35}'
      example: 948294-5
    address:
      type: object
      required:
        - country
      properties:
        street:
          type: string
          maxLength: 70
        buildingNumber:
          type: string
        city:
          type: string
        postalCode:
          type: string
        country:
          $ref: '#/components/schemas/countryCode'
      example:
        street: rue blue
        buildingNumber: '89'
        city: Paris
        postalCode: '75000'
        country: FR
    internationalAddress:
      type: object
      required:
        - country
        - postalCode
        - city
        - street
      properties:
        street:
          type: string
          maxLength: 70
        buildingNumber:
          type: string
        city:
          type: string
        postalCode:
          type: string
        country:
          $ref: '#/components/schemas/countryCode'
        state:
          type: string
      example:
        street: rue blue
        buildingNumber: '89'
        city: Paris
        postalCode: '75000'
        country: FR
    countryCode:
      description: ISO 3166 ALPHA2 country code
      type: string
      pattern: '[A-Z]{2}'
      example: SE
    creditorNameAndAddress:
      description: Creditor Name and Address in a free text field
      type: string
      maxLength: 140
      example: Max Masters, Main Street 1, 12345 City, Example Country
    amount:
      type: object
      required:
        - currency
        - amount
      properties:
        currency:
          $ref: '#/components/schemas/currencyCode'
        amount:
          $ref: '#/components/schemas/amountValue'
      example:
        currency: EUR
        amount: '123'
    balanceAfterTransaction:
      description: |
        The account balance at the time after the transaction is made. Only available for transactions in booked state.
      type: object
      properties:
        balanceAmount:
          $ref: '#/components/schemas/amount'
        balanceType:
          $ref: '#/components/schemas/balanceType'
    creditLimit:
      description: |
        Amount of credit extended to account.
      type: object
      required:
        - currency
        - amount
      properties:
        currency:
          $ref: '#/components/schemas/currencyCode'
        amount:
          $ref: '#/components/schemas/amountValue'
      example:
        currency: EUR
        amount: '123'
    currencyCode:
      description: |
        ISO 4217 Alpha 3 currency code.
      type: string
      pattern: '[A-Z]{3}'
      example: EUR
    amountValue:
      description: >
        The amount given with fractional digits, where fractions must be
        compliant to the currency definition.

        Up to 14 significant figures. Negative amounts are signed by minus.

        The decimal separator is a dot.


        **Example:**

        Valid representations for EUR with up to two decimals are:

          * 1056
          * 5768.2
          * -1.50
          * 5877.78
      type: string
      pattern: '-?[0-9]{1,14}(\.[0-9]{1,3})?'
      example: '5877.78'
    chargeBearer:
      description: Charge Bearer. ChargeBearerType1Code from ISO20022
      type: string
      enum:
        - DEBT
        - CRED
        - SHAR
        - SLEV
    remittanceInformationStructured:
      description: |
        Structured remittance information
      type: object
      required:
        - reference
      properties:
        reference:
          type: string
          maxLength: 35
        referenceType:
          type: string
          maxLength: 35
        referenceIssuer:
          type: string
          maxLength: 35
    remittanceInformationStructuredArray:
      description: |
