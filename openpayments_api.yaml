            'Example 3: SEPA Credit Transfer':
              $ref: '#/components/examples/paymentInitiationSctBody_payments_json'
    isoPaymentInitiationCrossBorder:
      description: >
        JSON request body for a cross-border payment initiation request message.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/isoPaymentInitiationCrossBorder_json'
          examples:
            'Example':
              $ref: '#/components/examples/paymentInitiationCrossBorderBody_payments_json'
    paymentInitiation:
      description: >
        JSON request body for a payment initiation request message.


        The following payment-products supported:
          * "domestic" with JSON-Body
          * "swedish-giro" with JSON-Body
          * "sepa-credit-transfers" with JSON-Body
          * "cross-border" with JSON-Body

        The following payment-services supported:
          * "payments"
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/paymentInitiation_json'
              - $ref: '#/components/schemas/paymentInitiationSwedishGiro_json'
              - $ref: '#/components/schemas/paymentInitiationSct_json'
              - $ref: '#/components/schemas/paymentInitiationCrossBorder_json'
          examples:
            'Example 1: ''payments'' - ''domestic''':
              $ref: '#/components/examples/paymentInitiationDomesticBody_payments_json'
            'Example 2: ''payments'' - ''swedish-giro''':
              $ref: '#/components/examples/paymentInitiationSwedishGiroBody_payments_json'   
            'Example 1: ''payments'' - ''cross-border''':
              $ref: '#/components/examples/paymentInitiationCrossBorderBody_payments_json'    
            'Example 4: ''payments'' - ''sepa-credit-transfers''':
              $ref: '#/components/examples/paymentInitiationSctBody_payments_json'
