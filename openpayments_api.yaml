      description: |
        JSON Request body for the "Confirmation of Funds Service"

        <table> 
        <tr> 
          <td>cardNumber</td> 
          <td>String </td>
          <td>Optional</td>
          <td>Card Number of the card issued by the PIISP. Should be delivered if available.</td>
        </tr> 
        <tr>
          <td>account</td>
          <td> Account Reference</td>
          <td>Mandatory</td>
          <td>PSU's account number.</td>
        </tr> 
        <tr> 
          <td>payee</td>
          <td>Max70Text</td>
          <td>Optional</td>
          <td>The merchant where the card is accepted as an information to the PSU.</td>
        </tr> 
        <tr>
          <td>instructedAmount</td>
          <td>Amount</td>
          <td>Mandatory</td>
          <td>Transaction amount to be checked within the funds check mechanism.</td>
        </tr> 
        </table>
      type: object
      required:
        - account
        - instructedAmount
      properties:
        cardNumber:
          description: |
            Card Number of the card issued by the PIISP. 
            Should be delivered if available.
          type: string
          maxLength: 35
        account:
          $ref: '#/components/schemas/accountReference'
        payee:
          description: Name payee
          type: string
          maxLength: 70
        instructedAmount:
          $ref: '#/components/schemas/amount'
    fxQuote:
      description: |
        JSON Body of a create FX quote request.
      type: object
      properties:
        sourceCurrency:
          description: The source currency.
          type: string
        targetCurrency:
          description: The target currency.
          type: string
        countryCode:
          description: The target country.
          type: string
        amount:
          description: The requested amount in target currency.
          type: string
        requestedExecutionDate:
          description: The requested execution date, for future payments.
          type: string
          format: date
