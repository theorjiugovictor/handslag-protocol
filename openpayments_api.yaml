        - cardAccounts
      properties:
        cardAccounts:
          type: array
          items:
            $ref: '#/components/schemas/cardAccountDetails'
    accountReport:
      description: >
        JSON based account report.

        This account report contains transactions resulting from the query
        parameters.


        'booked' shall be contained if bookingStatus parameter is set to
        "booked" or "both".


        'pending' is not contained if the bookingStatus parameter is set to
        "booked".
      type: object
      required:
        - _links
      properties:
        booked:
          $ref: '#/components/schemas/transactionList'
        pending:
          $ref: '#/components/schemas/transactionList'
        bankgiro:
          $ref: '#/components/schemas/transactionList'
        _links:
          $ref: '#/components/schemas/_linksAccountReport'
    cardAccountReport:
      description: >
        JSON based card account report.


        This card account report contains transactions resulting from the query
        parameters.
      type: object
      required:
        - booked
        - _links
      properties:
        booked:
          $ref: '#/components/schemas/cardTransactionList'
        pending:
          $ref: '#/components/schemas/cardTransactionList'
        _links:
          $ref: '#/components/schemas/_linksCardAccountReport'
    transactionList:
      description: Array of transaction details
      type: array
      items:
        $ref: '#/components/schemas/transactionDetails'
    cardTransactionList:
      description: Array of transaction details
      type: array
      items:
        $ref: '#/components/schemas/cardTransaction'
    transactionDetails:
      description: Transaction details
      type: object
      required:
        - transactionAmount
      properties:
        transactionId:
          description: >
            the Transaction Id can be used as access-ID in the API, where more
            details on an transaction is offered. 

            If this data attribute is provided this shows that the AIS can get
            access on more details about this 

            transaction using the GET Transaction Details Request 
          type: string
        entryReference:
          description: >
            Is the identification of the transaction as used e.g. for reference
            for deltafunction on application level. 

            The same identification as for example used within camt.05x
            messages.
          type: string
          maxLength: 35
        endToEndId:
          description: ID for the transaction provided by the initiator, and passed unchanged from debtor to creditor.
          type: string
          maxLength: 35
        mandateId:
          description: ID of the mandate given by the debtor to the creditor. Relevant for e.g. SEPA Identification of Mandates. 
          type: string
          maxLength: 35
        checkId:
          description: Identification of a Cheque.
          type: string
          maxLength: 35
        creditorId:
          description: Identification of Creditors, e.g. a SEPA Creditor ID.
          type: string
          maxLength: 35
        bookingDate:
          $ref: '#/components/schemas/bookingDate'
        valueDate:
          description: >-
            Date at which an entry is posted to an account on the ASPSP's books.
          type: string
          format: date
        transactionAmount:
          $ref: '#/components/schemas/amount'
        balanceAfterTransaction:
          $ref: '#/components/schemas/balanceAfterTransaction'
        currencyExchange:
          $ref: '#/components/schemas/reportExchangeRateList'
        creditorName:
          $ref: '#/components/schemas/creditorName'
        creditorAccount:
          $ref: '#/components/schemas/trnsCreditorAccountReference'
        ultimateCreditor:
          $ref: '#/components/schemas/ultimateCreditor'
        debtorName:
          $ref: '#/components/schemas/debtorName'
        debtorAccount:
          $ref: '#/components/schemas/accountReference'
        ultimateDebtor:
          $ref: '#/components/schemas/ultimateDebtor'
        remittanceInformationUnstructured:
          $ref: '#/components/schemas/remittanceInformationUnstructured'
        remittanceInformationStructured:
          description: >
            Reference as contained in the structured remittance reference
            structure (without the surrounding XML structure).


            Different from other places where the content is in plain form and
            not in form of a structured field.
          type: string
          maxLength: 140
        remittanceInformationUnstructuredArray:
          $ref: '#/components/schemas/remittanceInformationUnstructuredArray'
        remittanceInformationStructuredArray:
          $ref: '#/components/schemas/remittanceInformationStructuredArray'
        additionalInformation:
          description: >
            Might be used by the ASPSP to transport additional transaction
            related information to the PSU.
          type: string
          maxLength: 512
        purposeCode:
          $ref: '#/components/schemas/purposeCode'
        bankTransactionCode:
          $ref: '#/components/schemas/bankTransactionCode'
        proprietaryBankTransactionCode:
          $ref: '#/components/schemas/proprietaryBankTransactionCode'
        transactionListId:
          $ref: '#/components/schemas/transactionListId'
        paymentId:
          $ref: '#/components/schemas/transactionPaymentId'
        aggregateTransactionId:
          description: The transaction ID of the aggregated transaction. 
          type: string
        aggregateTransactionListId:
          description: The transaction list ID of the aggregated transaction.
          type: string
        aggregateId:
          description: Serial number for the Bankgiro deposit.
          type: integer
        aggregateAmount:
          description: The aggregated amount of all transactions in the deposit.
          type: string
        aggregateRemittanceInformationUnstructured:
          description: >-
            The unstructured remittance information of the aggregated
            transaction.
          type: string
        debtorAddress:
          $ref: '#/components/schemas/address'
        debtorOrganisationId:
          description: Organisation number of the debtor.
          type: string
        isAliasPayin:
          description: Is set if the transaction represents an individual incoming payment derived from an aggregated transaction.
          type: boolean
        isAliasPayout:
          description: Is set if the transaction represents an individual outgoing payment derived from an aggregated transaction. 
          type: boolean
        isEnriched:
          $ref: '#/components/schemas/isEnriched'
        _links:
          $ref: '#/components/schemas/_linksTransactionDetails'
        transactionFees:
          $ref: '#/components/schemas/transactionFees'
    transactionDetailsWithTppMessages:
      description: Transaction details
