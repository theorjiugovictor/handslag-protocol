  parameters:
    X-ISO-Fallback-Enabled:
      name: X-ISO-Fallback-Enabled
      in: header
      description: |
        If it equals "true", the TPP indicates that, once the specified consent expires, the PSU wishes to fetch account information via ISO 20022 for the ISO-onboarded accounts that were included in the consent creation. 

        This parameter should be included while the consent is valid and after it expires.
      required: false
      schema:
        type: string
        enum:
          - 'true'
          - 'false'
    paymentService:
      name: payment-service
      in: path
      description: |
        The specified payment service. See Statuses & Types documentation for descriptions of each payment service. 
      required: true
      schema:
        type: string
        enum:
          - payments
    paymentProduct:
      name: payment-product
      in: path
      description: >
        The specified payment product. See Statuses & Types documentation for descriptions of each payment product.
      required: true
      schema:
        type: string
        enum:
          - domestic
          - swedish-giro
          - sepa-credit-transfers
          - cross-border
    paymentId:
      name: paymentId
      in: path
      description: Resource identification of the generated payment initiation resource.
      required: true
      schema:
        $ref: '#/components/schemas/paymentId'
    cancellationId:
      name: cancellationId
      in: path
      description: Identification for cancellation resource.
      required: true
      schema:
        $ref: '#/components/schemas/cancellationId'
    authorisationId:
      name: authorisationId
      in: path
      description: Resource identification of the related SCA.
      required: true
      schema:
        $ref: '#/components/schemas/authorisationId'
    accountId:
      name: account-id
      in: path
      description: >
        This identification is denoting the addressed account. 

        The accountId is retrieved by using a "Read Account List" call. 

        The accountId is the "id" attribute of the account structure. 

        Its value is constant at least throughout the lifecycle of a given
        consent.
      required: true
      schema:
        $ref: '#/components/schemas/accountId'
    transactionId:
      name: transactionId
      in: path
      description: >
        This identification is given by the attribute transactionId of the
        corresponding entry of a transaction list.
      required: true
      schema:
        $ref: '#/components/schemas/transactionId'
    basketId_PATH:
      name: basketId
      in: path
      description: |
        This identification of the corresponding signing basket object.
      required: true
      schema:
        $ref: '#/components/schemas/basketId'
    consentId_PATH:
      name: consentId
      in: path
      description: >
        ID of the corresponding consent object as returned by an Account
        Information Consent Request.
      required: true
      schema:
        $ref: '#/components/schemas/consentId'
    fxQuoteId_PATH:
      name: fxQuoteId
      in: path
      description: Resource identification of the FX Quote.
      required: true
      schema:
        $ref: '#/components/schemas/fxQuoteId'
    consentId_HEADER_optional:
      name: Consent-ID
      in: header
      description: >
        The ID of the consent authorizing access to the PSU's account information. This data element may be contained if the payment initiation
        transaction is part of a session, i.e. combined AIS/PIS service.
      required: false
      schema:
        $ref: '#/components/schemas/consentId'
    consentId_HEADER_mandatory:
      name: Consent-ID
      in: header
      description: >
        The ID of the consent authorizing access to the PSU's account information. 
      required: true
      schema:
        $ref: '#/components/schemas/consentId'
    withBalanceQuery:
      name: withBalance
      in: query
      description: >
        If "true", the list of accessible payment accounts is retrieved including balances, if granted by the PSU in the related consent and if made available by the ASPSP. 
      required: false
      schema:
        type: boolean
    dateFrom:
      name: dateFrom
      in: query
      description: >
        Starting date of the transaction list. For booked transactions, this is the booking date. For pending transactions, this is the entry date, which may not be transparent in the API or other ASPSP channels.
      required: false
      schema:
        type: string
        format: date
    dateTo:
      name: dateTo
      in: query
      description: >
        End date of the transaction list. For booked transactions, this is the booking date. For pending transactions, this is the entry date, which may not be transparent in the API or other ASPSP channels.
      required: false
      schema:
        type: string
        format: date
    entryReferenceFrom:
      name: entryReferenceFrom
      in: query
      description: >
        This data attribute is indicating that the AISP is in favour to get all
        transactions after 

        the transaction with identification entryReferenceFrom alternatively to
        the above defined period. 

        This is a implementation of a delta access. 

        If this data element is contained, the entries "dateFrom" and "dateTo"
        might be ignored by the ASPSP 

        if a delta report is supported.


        Optional if supported by API provider.
      required: false
      schema:
        type: string
    bookingStatus:
      name: bookingStatus
      in: query
      description: >
        Booking status of the requested transactions. "booked" is always supported by the ASPSP. Supporting "pending" and "both" is optional for the ASPSP and an error code will be returned if not supported.
      required: true
      schema:
        type: string
        enum:
          - booked
          - pending
          - both
  #  deltaList:
  #    name: deltaList
  #    in: query
  #    description: >-
  #      This data attribute is indicating that the AISP is in favour to get all
  #      transactions after the last report access for this PSU on the addressed
  #      account. This is another implementation of a delta access-report.
  #
  #      This delta indicator might be rejected by the ASPSP if this function is
  #      not supported.
  #
  #      Optional if supported by API provider.
  #      type: boolean
    X-Request-ID:
      name: X-Request-ID
      in: header
      description: >-
        ID of the request, unique to the call, as determined by the initiating
        party.
      required: true
      example: 99391c7e-ad88-49ec-a2ad-99ddcb1f7721
      schema:
        type: string
        format: uuid
    X-BicFi:
      name: X-BicFi
      in: header
      description: >-
        Unique ID of the financial institution. For Banks this is the same as the SWIFT code, i.e. SWEDSESS for Swedbank SE.
      required: true
      schema:
        type: string
        pattern: '[A-Z]{6,6}[A-Z2-9][A-NP-Z0-9]([A-Z0-9]{3,3}){0,1}'
        example: AAAASEBB
    X-AffiliatedASPSP-ID:
      name: X-AffiliatedASPSP-ID
      in: header
      description: |
        Some ASPSPs have sub-branches. The ID of an affiliated ASPSP as related to the X-BicFi header
      schema:
        type: string
      required: false
      example: 8191
    Digest:
      name: Digest
      in: header
      description: >-
        Is contained if and only if the "Signature" element is contained in the
        header of the request.
      schema:
        type: string
      required: false
      example: SHA-256=hl1/Eps8BEQW58FJhDApwJXjGY4nr1ArGDHIT25vq6A=
    Signature:
      name: Signature
      in: header
      description: >
        A signature of the request by the TPP on application level. This might
        be mandated by ASPSP.
      schema:
        type: string
      required: false
      example: >
        keyId="SN=9FA1,CA=CN=D-TRUST%20CA%202-1%202015,O=D-Trust%20GmbH,C=DE",algorithm="rsa-sha256",
        headers="Digest X-Request-ID PSU-ID TPP-Redirect-URI Date",
        signature="Base64(RSA-SHA256(signing string))"
    TPP-Signature-Certificate:
      name: TPP-Signature-Certificate
      in: header
      description: |
        The certificate used for signing the request, in base64 encoding. 
        Must be contained if a signature is contained.
      schema:
        type: string
        format: byte
      required: false
    TPP-Redirect-Preferred:
      name: TPP-Redirect-Preferred
      in: header
      description: >
        If it equals "true", the TPP prefers a redirect over an embedded SCA
        approach.

        If it equals "false", the TPP prefers not to be redirected for SCA. 
        The ASPSP may not support both types.
      schema:
        type: string
        enum:
          - 'true'
          - 'false'
      required: true
    TPP-Redirect-URI:
      name: TPP-Redirect-URI
      in: header
      description: >
        URI of the TPP, where the transaction flow shall be redirected to after
        a Redirect.


        Mandated for the Redirect SCA Approach, specifically 

        when TPP-Redirect-Preferred equals "true".

        It is recommended to always use this header field.


        **Remark for Future:** 

        This field might be changed to mandatory in the next version of the
        specification.
      schema:
        type: string
        format: uri
      required: false
    TPP-Nok-Redirect-URI:
      name: TPP-Nok-Redirect-URI
      in: header
      description: >
        If this URI is contained, the TPP is asking to redirect the transaction
        flow to this address instead of the TPP-Redirect-URI in case

        of a negative result of the redirect SCA method. This might be ignored
        by the ASPSP.
      schema:
        type: string
        format: uri
      required: false
    TPP-Explicit-Authorisation-Preferred:
      name: TPP-Explicit-Authorisation-Preferred
      in: header
      description: >
        If it equals "true", the TPP prefers to start the authorisation process
        separately, 

        e.g. because of the usage of a signing basket. 

        This preference might be ignored by the ASPSP, if a signing basket is
        not supported as functionality.


        If it equals "false" or if the parameter is not used, there is no
        preference of the TPP. 

        This especially indicates that the TPP assumes a direct authorisation of
        the transaction in the next step, 

        without using a signing basket.
      schema:
        type: string
        enum:
          - 'true'
          - 'false'
      required: false
    TPP-Rejection-NoFunds-Preferred:
      name: TPP-Rejection-NoFunds-Preferred
      in: header
      description: >
        If it equals "true" then the TPP prefers a rejection of the payment
        initiation in case the ASPSP is 

        providing an integrated confirmation of funds request an the result of
        this is that not sufficient 

        funds are available.


        If it equals "false" then the TPP prefers that the ASPSP is dealing with
        the payment initiation like 

        in the ASPSPs online channel, potentially waiting for a certain time
        period for funds to arrive to initiate the payment.


        This parameter might be ignored by the ASPSP.
      schema:
        type: string
        enum:
          - 'true'
          - 'false'
      required: false
    TPP-Notification-URI:
      name: TPP-Notification-URI
      in: header
      description: >
        URI for the Endpoint of the TPP-API to which the status of the payment
        initiation should be sent.

        This header field may by ignored by the ASPSP.
      schema:
        type: string
      required: false
    TPP-Notification-Content-Preferred:
      name: TPP-Notification-Content-Preferred
      in: header
      description: >
        The string has the form 


        status=X1, ..., Xn


        where Xi is one of the constants SCA, PROCESS, LAST and where constants
        are not

        repeated.

        The usage of the constants supports the of following semantics:

          SCA: A notification on every change of the scaStatus attribute for all related authorisation processes is preferred by the TPP.

          PROCESS: A notification on all changes of consentStatus or transactionStatus attributes is preferred by the TPP.
          LAST: Only a notification on the last consentStatus or transactionStatus as available in the XS2A interface is preferred by the TPP.

        This header field may be ignored, if the ASPSP does not support resource
        notification services for the related TPP.
      schema:
        type: string
      required: false
    PSU-ID:
      name: PSU-ID
      in: header
      description: >
        Client ID of the PSU in the ASPSP client interface. This is typically a local social security number or another unique login ID.
      schema:
        type: string
      required: true
      example: 199002092386
    PSU-ID-Type:
      name: PSU-ID-Type
      in: header
      description: >
        Type of the PSU-ID, needed in scenarios where PSUs have several PSU-IDs
        as access possibility.
      schema:
        type: string
      required: false
    PSU-Authoriser-ID: 
      name: PSU-Authoriser-ID
      in: header
      description: >
        ID provided by certain ASPSPs to uniquely identify the authorising PSU, e.g. a customer ID. Only relevant if supported by the ASPSP.
      schema: 
        type: string
      required: false
    PSU-Corporate-ID:
      name: PSU-Corporate-ID
      in: header
      description: >
        Corporate Client ID for the ASPSP. This is typically the unique Corporate Id in the local format. E.g. Org. nummer for SE, KVK for NL. **Mandatory in the corporate scope**.
      schema:
        type: string
      required: false
      example: 5560160680
    PSU-Corporate-ID-Type:
      name: PSU-Corporate-ID-Type
      in: header
      description: >
        Might be mandated in the ASPSP's documentation. Only used in a corporate
        context.
      schema:
        type: string
      required: false
    PSU-IP-Address_mandatory:
      name: PSU-IP-Address
      in: header
      description: >
        The IP address of the PSU from the HTTP request between the PSU and the TPP.
      schema:
        type: string
        format: ipv4
      required: true
      example: 192.168.8.78
    PSU-IP-Address_optional:
      name: PSU-IP-Address
      in: header
      description: >
        The IP address of the PSU from the HTTP request between the PSU and the TPP.
      schema:
        type: string
        format: ipv4
      required: false
      example: 192.168.8.78
    PSU-IP-Address_conditionalForAis:
      name: PSU-IP-Address
      in: header
      description: >
        The IP address of the PSU from the HTTP request between the PSU and the TPP.
      schema:
        type: string
        format: ipv4
      required: false
      example: 192.168.8.78
    X-Consent-Type:
      name: X-Consent-Type
      in: header
      description: >
        When a special consent type is needed.
      schema:
        type: string
        enum:
          - sepaDirectDebit
      required: false
      example: SepaDirectDebit
    PSU-IP-Port:
      name: PSU-IP-Port
      in: header
      description: >
        The forwarded IP Port header field consists of the corresponding HTTP
        request IP Port field between PSU and TPP, if available.
      schema:
        type: string
      required: false
      example: '1234'
    PSU-Accept:
      name: PSU-Accept
      in: header
      description: >
        The forwarded IP Accept header fields consist of the corresponding HTTP
        request Accept header fields between PSU and TPP, if available.
      schema:
        type: string
      required: false
    PSU-Accept-Charset:
      name: PSU-Accept-Charset
      in: header
      description: >
        The forwarded IP Accept header fields consist of the corresponding HTTP
        request Accept header fields between PSU and TPP, if available.
      schema:
        type: string
      required: false
    PSU-Accept-Encoding:
      name: PSU-Accept-Encoding
      in: header
      description: >
        The forwarded IP Accept header fields consist of the corresponding HTTP
        request Accept header fields between PSU and TPP, if available.
      schema:
        type: string
      required: false
    PSU-Accept-Language:
      name: PSU-Accept-Language
      in: header
      description: >
        The forwarded IP Accept header fields consist of the corresponding HTTP
        request Accept header fields between PSU and TPP, if available.
      schema:
        type: string
      required: false
    PSU-User-Agent_optional:
      name: PSU-User-Agent
      in: header
      description: >
        The Agent header from the HTTP request between the PSU and the TPP, identifying the browser used by the PSU.
      schema:
        type: string
      required: false
    PSU-User-Agent_mandatory:
      name: PSU-User-Agent
      in: header
      description: >
        The Agent header from the HTTP request between the PSU and the TPP, identifying the browser used by the PSU.
      schema:
        type: string
      required: true
    PSU-Http-Method:
      name: PSU-Http-Method
      in: header
      description: |
        HTTP method used at the PSU ? TPP interface, if available.
        Valid values are:
        * GET
        * POST
        * PUT
        * PATCH
        * DELETE
      schema:
        type: string
        enum:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
      required: false
    PSU-Device-ID:
      name: PSU-Device-ID
      in: header
      description: >
        UUID (Universally Unique Identifier) for a device, which is used by the
        PSU, if available.

        UUID identifies either a device or a device dependant application
        installation.

        In case of an installation identification this ID need to be unaltered
        until removal from device.
      schema:
        type: string
        format: uuid
      required: false
      example: 99435c7e-ad88-49ec-a2ad-99ddcb1f5555
    PSU-Geo-Location:
      name: PSU-Geo-Location
      in: header
      description: >
        The forwarded Geo Location of the corresponding http request between PSU
        and TPP if available.
      schema:
        type: string
        pattern: GEO:-?[0-9]{1,2}\.[0-9]{6};-?[0-9]{1,3}\.[0-9]{6}
      required: false
      example: GEO:52.506931;13.144558
    FX-Quote-Id:
      name: FX-Quote-Id
      in: header
      description: >-
        ID of the FX Quote to be used for the payment. Used for cross-border
        payments only.
      required: false
      example: Q100000ABC
      schema:
        type: string
    FX-Quote-Id_mandatory:
      name: FX-Quote-Id
      in: header
      description: >-
        ID of the FX Quote to be used for the payment. Used for cross-border
        payments only.
      required: true
      example: Q100000ABC
      schema:
        type: string
    isoCountryCodesQuery:
      name: isoCountryCodes
      in: query
      description: |
        ISO Country Codes for the countries to get ASPSPs for
      required: false
      schema:
        $ref: '#/components/schemas/isoCountryCodes'
      example: SE,FI
    cityId:
      name: city-id
      in: path
      description: |
        The ID of the city
      required: true
      schema:
        type: string
        format: uuid
      example: 37efa883-c8ad-4ff7-927b-b11b02beb923
    isoCountryCode:
      name: isoCountryCode
      in: path
      description: |
        ISO Country Code for the country
      required: true
      schema:
        pattern: ^[a-zA-Z]{2,2}$
        type: string
      example: SE
    bicFi:
      name: bicFi
      in: path
      description: |
        The BICFI of the ASPSP
      required: true
      schema:
        pattern: ^[A-Z]{6,6}[A-Z2-9][A-NP-Z0-9]([A-Z0-9]{3,3}){0,1}$
        type: string
      example: OPBKSE21
