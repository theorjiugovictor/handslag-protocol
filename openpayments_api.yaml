      - url: https://api.openbankingplatform.com
        description: PSD2 production server
    post:
      summary: Create Payment
      description: >
        Initiates a payment at the ASPSP.

        ### Variants of Payment Initiation Requests

        List of supported `payment-product` values:
          - **domestic**
          - **swedish-giro**
          - **sepa-credit-transfers**
          - **cross-border**

        Furthermore the request body depends on the `payment-service`:
          * **payments**: A single payment initiation request.

         Single and mulitilevel SCA Processes

        The Payment Initiations are independent from their SCA requirements, which are created separately. 
        Some ASPSP's, especially in corporate contexts, require more than one authorisation from different PSUs.

      operationId: initiatePayment
      tags:
        - Payment Initiation Service (PIS)
      security:
        - oAuth2Sandbox:
          - paymentinitiation private
        - oAuth2Sandbox:
          - paymentinitiation corporate
        - oAuth2Production:
          - paymentinitiation private
        - oAuth2Production:
          - paymentinitiation corporate
      parameters:
        - $ref: '#/components/parameters/paymentService'
