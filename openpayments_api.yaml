  /kyc/integration/v1/new/{PSU-Corporate-ID}:
    servers:
      - url: https://api.sandbox.openbankingplatform.com
        description: KYC sandbox server
      - url: https://api.openbankingplatform.com
        description: KYC production server
    post:
      tags:
        - KYC Service
      security:
        - oAuth2Sandbox:
          - paymentinitiation corporate
        - oAuth2Production:
          - paymentinitiation corporate
      summary: Create KYC
      description: >-
        Enter the `PSU-Corporate-ID` of the company for which to initiate the KYC process. This generates a KYC webform URL valid for 24 hours. If more time is needed, generate a new URL. This webform guides the user through the whole KYC process. To check if the KYC was successful poll the KYC Service's `/status` endpoint.
      operationId: new
      parameters:
        - name: PSU-Corporate-ID
          description: Corporate Client ID. This is typically the unique Corporate ID in the local format. E.g. Org. nummer for SE, KVK for NL.
          in: path
          required: true
          schema:
            type: string
            example: 123456-1234
        - name: countryCode
          in: query
          required: true
          description: ISO 3166 ALPHA2 country code
          schema:
            type: string
            example: SE
            pattern: '[A-Z]{2}'
        - $ref: '#/components/parameters/X-Request-ID'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartNewKycInstanceResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Server Error
  /kyc/integration/v1/status/{PSU-Corporate-ID}:
    servers:
      - url: https://api.sandbox.openbankingplatform.com
        description: KYC sandbox server
      - url: https://api.openbankingplatform.com
        description: KYC production server
    get:
      tags:
        - KYC Service
      security:
        - oAuth2Sandbox:
          - paymentinitiation corporate
        - oAuth2Production:
          - paymentinitiation corporate
      summary: Get KYC Status
      description: >-
        Returns the KYC status of the company. If the `kycStatus` is `Valid`, the company is allowed to make payments. If the `kycStatus` is `Invalid`, a new KYC process can be initiated via the KYC Service's /new endpoint.
      operationId: status
      parameters:
        - name: PSU-Corporate-ID
          description: Corporate Client ID. This is typically the unique Corporate ID in the local format. E.g. Org. nummer for SE, KVK for NL.
          in: path
          required: true
          schema:
            example: 123456-1234
            type: string
        - $ref: '#/components/parameters/X-Request-ID'
      responses:
        '200':
          $ref: '#/components/responses/getKycStatusResponse-200'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Server Error
  /psd2/paymentinitiation/v1/{payment-service}/{payment-product}:
    servers:
      - url: https://api.sandbox.openbankingplatform.com
