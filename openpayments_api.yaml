          format: date-time
        payments:
          type: array
          items:
            $ref: '#/components/schemas/PaymentStatusEnum'
          nullable: true
      additionalProperties: false
    BulkPaymentStatusEnum:
      enum:
        - valid
        - cancelled
        - authorizationInitiated
        - partiallySigned
        - signed
        - finalised
      type: string
    PaymentStatusEnum:
      enum:
        - received
        - failed
        - partiallySigned
        - pending
        - cancelled
        - settled
        - rejected
      type: string
    CreateBulkPayment:
      required:
        - bicFi
        - controlSum
        - numberOfTransactions
      type: object
      properties:
        bicFi:
          type: string
        numberOfTransactions:
          type: integer
          format: int32
        controlSum:
          type: number
          format: double
        domestic:
          type: array
          items:
            $ref: '#/components/schemas/paymentInitiation_json'
          nullable: true
        swedishGiro:
          type: array
          items:
            $ref: '#/components/schemas/paymentInitiationSwedishGiro_json'
          nullable: true
      additionalProperties: false
    CreateBulkPaymentOutput:
      required:
        - bulkPaymentId
        - latestAuthorisationDate
        - numberOfAuthorisations
        - redirectUri
        - status
      type: object
      properties:
        bulkPaymentId:
          type: string
          description: Bulk payment resource ID
          format: uuid
        status:
          $ref: '#/components/schemas/BulkPaymentStatusEnum'
        latestAuthorisationDate:
          type: string
          description: >-
            Latest calendar date when bulk payment must be signed to ensure
            money transfers in time, based on the earliest payment execution
            date in the bulk
        adjustedPaymentExecutionDate:
          type: string
          description: >-
            If payment execution date is adjusted by setting header
            X-PaymentExecutionAdjustmentDays to a non-zero integer value, this
            is the resulting calendar date when the payments will be scheduled
            for execution.
          nullable: true
        numberOfAuthorisations:
          type: integer
          description: Total number of authorisations required for this bulk payment
          format: int32
        redirectUri:
          type: string
          description: "Redirect URI template to use for redirecting the end user for authorising/signing the bulk payment. Please note that all inserted query parameter values must be URL-encoded (rfc3986) not to cause the url to break.\r\n<table><tr><th>Query parameter name</th><th>Required</th><th>Format</th><th>Description</th></tr><tr><td>context</td><td>Y</td><td>UUID</td><td>Unique link context, associated with a specific bulk payment</td></tr><tr><td>client_id</td><td>Y</td><td>UUID</td><td>Client id used for creating the bulk payment. Replace \"[CLIENT_ID]\" in template</td></tr><tr><td>redirect_uri</td><td>Y</td><td>URL</td><td>URL to where the flow shall return. Must be a predetermined registered URL. Replace \"[REDIRECT_URI]\" in template</td></tr><tr><td>profile</td><td>N</td><td>string</td><td>Name of graphical/language profile to use in UI</td></tr><tr><td>state</td><td>N</td><td>string</td><td>Arbitrary state value that will be carried back to [REDIRECT_URI]. Replace \"[STATE]\" in template</td></tr><tr><td>authoriser_ref</td><td>N</td><td>string</td><td>Reference to the end user, will be set on all payments authorised by the link user</td></tr><tr><td>error_reference</td><td>N</td><td>UUID</td><td>Will only be present in the redirect back to [REDIRECT_URI] if an error occurs. Value represents a unique reference to the step that failed</td></tr><tr><td>error_category</td><td>N</td><td>string</td><td>Will only be present in the redirect back to [REDIRECT_URI] if an error occurs. Value will give an error category, one of:<br />* UNKNOWN<br />* EXPIRED_LINK<br />* INVALID_LINK<br />* TEMPORARY_TECHNICAL_ERROR<br />* SIGNATURE_REJECTION</td></tr></table>"
      additionalProperties: false
    ProblemDetails:
      type: object
      properties:
        type:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        status:
          type: integer
          format: int32
          nullable: true
        detail:
          type: string
          nullable: true
        instance:
          type: string
          nullable: true
      additionalProperties: {}
    kycStatus:
      example: Invalid
      type: string
      enum:
        - Valid
        - Invalid
    getKycStatusResponse:
      type: object
      properties:
        psuCorporateId:
          type: string
          example: 123456-1234
        kycStatus:
          $ref: '#/components/schemas/kycStatus'
        kycValidUntil:
          type: string
          nullable: true
          example: '2024-09-06'
    StartNewKycInstanceResponse:
      type: object
      required:
        - kycUrl
      properties:
        kycUrl:
          $ref: '#/components/schemas/kycUrl'
    kycUrl:
      type: string
      example: >-
        https://kyc.openbankingplatform.com/?instanceId=008b3d7e-ae80-4577-8ed9-36a2b2b0fa6d
    clearingNumber:
      description: |
        Bank account clearing number. Used to identify the financial institution within a domestic payment system. 
      type: string
      pattern: '[0-9]{1,5}'
      example: '5392'
    accountNumber:
      description: |
        Bank account number. Used to identify the particular customer account within the financial institution. 
      type: string
      pattern: '[a-zA-Z0-9]{1,30}'
      example: BARC12345612345678
    paymentId:
      description: ID of the generated payment initiation resource. Only available for transactions generated via the Open Banking Platform.
      type: string
      example: 1234-wertiq-983
    paymentIdList:
      description: A list of paymentIds.
      type: array
      minItems: 1
      items:
        $ref: '#/components/schemas/paymentId'
    basketId:
      description: ID of the generated signing basket resource.
      type: string
      example: c7197f20-4224-4c8c-b0fb-b3942105443b
    authorisationId:
      description: Resource identification of the related SCA
      type: string
      example: b391be2a-5fa0-4da5-afa7-6778d7ca2dc0
    authenticationMethodId:
      description: >
        An identification provided by the ASPSP for the later identification of
        the authentication method selection.
      type: string
      maxLength: 35
      example: myAuthenticationID
    accountId:
      description: >-
        This identification is denoting the addressed account, where the
        transaction has been performed.
      type: string
      example: qwer3456tzui7890
    consentId:
      description: >
        ID of the corresponding consent object as returned by an Account
        Information Consent Request.
      type: string
    consentIdList:
      description: A list of consentIds
      type: array
      minItems: 1
      items:
        $ref: '#/components/schemas/consentId'
    transactionId:
      description: >
        This identification is given by the attribute transactionId of the
        corresponding entry of a transaction list.
      type: string
      example: 3dc3d5b3-7023-4848-9853-f5400a64e80f
    cancellationId:
      description: Identification for cancellation resource
      type: string
      example: b391be2a-5fa0-4da5-afa7-6778d7ca2dc0
    cardTransactionId:
      description: Unique end to end identity.
      type: string
      maxLength: 35
    terminalId:
      description: Identification of the Terminal, where the card has been used.
      type: string
      maxLength: 35
    entryReference:
      description: >
        ID of the transaction as used e.g. for reference for deltafunction on application level.
      type: string
      maxLength: 35
    transactionStatus:
      description: |
        Uses codes from the ISO 20022 data table. See Statues & Types documentation for full descriptions of status codes. 
      type: string
      enum:
        - ACCC
        - ACCP
        - ACSC
        - ACSP
        - ACTC
        - ACWC
        - ACWP
        - RCVD
        - PDNG
        - RJCT
        - CANC
        - ACFC
        - PATC
        - PART
      example: ACSP
    transactionStatus_SBS:
      description: |
        Uses codes from the ISO 20022 data table. See Statuses & Types documentation for full descriptions of status codes. 
      type: string
      enum:
        - ACTC
        - PATC
        - RCVD
        - RJCT
        - CANC
      example: RCVD
    scaStatus:
      description: >
        Contains information about the status of the SCA method applied. See Statuses & Types documentation for full descriptions of allowed values.
      type: string
      enum:
        - received
        - psuIdentified
        - psuAuthenticated
        - scaMethodSelected
        - started
        - finalised
        - failed
        - exempted
        - authenticationStarted
        - authoriseCreditorAccountStarted
      example: psuAuthenticated
    scaAuthenticationData:
      description: |
        SCA authentication data, depending on the chosen authentication method. 
        If the data is binary, then it is base64 encoded.
      type: string
    consentStatus:
      description: >
        Overall lifecycle status of the consent. See Statuses & Types documentation for full descriptions of allowed values. 
      type: string
      enum:
        - received
        - rejected
        - valid
        - revokedByPsu
        - expired
        - terminatedByTpp
        - partiallyAuthorised
    transactionFee:
      type: object
      properties:
        Amount:
          $ref: '#/components/schemas/amount'
        ChargeBearer:
          $ref: '#/components/schemas/chargeBearer'
    transactionFees:
      description: Array of transaction fees
      type: array
      items:
        $ref: '#/components/schemas/transactionFee'
    transactionFeeIndicator:
      description: >
        If "true", the transaction will involve specific transaction costs as shown by the ASPSP in their public price list or as agreed between the ASPSP and PSU. If "false", the transaction will not involve additional specific transaction costs to the PSU.
      type: boolean
    recurringIndicator:
      description: |
        If "true", the consent is for recurring access to the account data. If "false", the consent is for one-off access to the account data.
      type: boolean
      example: false
    combinedServiceIndicator:
      description: >
        If "true", indicates that a payment initiation service will be addressed in the same "session".
      type: boolean
      example: false
    batchBookingPreferred:
      description: >
        If "true", the PSU prefers only one booking entry. If "false", the PSU prefers individual booking of all included individual transactions. The ASPSP will follow this preference according to contracts agreed with the PSU.
      type: boolean
      example: false
    scaMethods:
      description: >
        Optional list of available Strong Customer Authentication (SCA) methods, shown if SCA is required and the user can choose a method. When this is present, a `startAuthorisationWithAuthenticationMethodSelection` link will also be included for starting the authorisation with method selection. 
      type: array
      items:
        $ref: '#/components/schemas/authenticationObject'
    chosenScaMethod:
      $ref: '#/components/schemas/authenticationObject'
    authenticationType:
      description: >
        Type of the authentication method. See Statuses & Types for full descriptions of authentication method types.
      type: string
      enum:
        - SMS_OTP
        - CHIP_OTP
        - PHOTO_OTP
        - PUSH_OTP
    authenticationObject:
      description: |
        Authentication Object
      type: object
      required:
        - authenticationType
        - authenticationMethodId
      properties:
        authenticationType:
          $ref: '#/components/schemas/authenticationType'
        authenticationVersion:
          description: >
            Specifies the version of the authentication method. Useful when multiple tools exist under the same method type. 
          type: string
        authenticationMethodId:
          $ref: '#/components/schemas/authenticationMethodId'
        name:
          description: >
            A user-defined or bank-provided label for the authentication method (e.g. "SMS OTP on phone +49160 xxxxx 28"). This should be shown to the user when offering authentication method choices.
          type: string
          example: SMS OTP on phone +49160 xxxxx 28
        explanation:
          description: |
            Detailed information about the SCA method for the PSU.
          type: string
          example: Detailed information about the SCA method for the PSU.
    signingBasket:
      description: |
        JSON Body of a establish signing basket request.
        The body shall contain at least one entry.
      type: object
      properties:
        paymentIds:
          $ref: '#/components/schemas/paymentIdList'
    challengeData:
      description: >
        Contained in addition to the data element `chosenScaMethod` if challenge data is needed for SCA. In rare cases, this attribute is also used in the context of the `startAuthorisationWithPsuAuthentication` link. 
      type: object
      properties:
        image:
          type: string
          format: byte
          description: |
            PNG data (max. 512 kilobyte) to be displayed to the PSU,
            Base64 encoding, cp. [RFC4648].
            This attribute is used only, when PHOTO_OTP or CHIP_OTP
            is the selected SCA method.
        data:
          type: array
          items:
            type: string
          description: Challenge data
        imageLink:
          type: string
          format: url
          description: >-
            A link where the ASPSP will provides the challenge image for the
            TPP.
        otpMaxLength:
          type: integer
          description: The maximal length for the OTP to be typed in by the PSU.
        otpFormat:
          type: string
          description: >-
            The format type of the OTP to be typed in. The admitted values are
            "characters" or "integer".
          enum:
            - characters
            - integer
        additionalInformation:
          type: string
          description: |
            Additional explanation for the PSU to explain
            e.g. fallback mechanism for the chosen SCA method.
            The TPP is obliged to show this to the PSU.
    hrefType:
      description: Link to a resource
      type: object
      properties:
        href:
          $ref: '#/components/schemas/hrefEntry'
    hrefEntry:
      description: Link to a resource
      type: string
      example: /v1/payments/sepa-credit-transfers/1234-wertiq-983
    authorisationsList:
      description: An array of all authorisationIds
      type: array
      items:
        $ref: '#/components/schemas/authorisationId'
    authorisations:
      description: An array of all authorisationIds
      type: object
      required:
        - authorisationIds
      properties:
        authorisationIds:
          $ref: '#/components/schemas/authorisationsList'
        tppMessages:
          type: array
          items:
            $ref: '#/components/schemas/tppMessage2XX'
