components:
  securitySchemes:
    oAuth2Sandbox:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://auth.sandbox.openbankingplatform.com/connect/token
          scopes:
            aspspinformation: ASPSP Information
            accountinformation: Account Information
            paymentinitiation: Payment Initiation
            private: Private accounts context
            corporate: Corporate accounts context
    oAuth2Production:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://auth.openbankingplatform.com/connect/token
          scopes:
            aspspinformation: ASPSP Information
            accountinformation: Account Information
            bankgiroinformation: Account Information Enrichment
            paymentinitiation: Payment Initiation
            private: Private accounts context
            corporate: Corporate accounts context
  schemas:
    vopParty:
      description: The registered name for the account.
      type: object
      required:
        - name
      properties:
        name:
          $ref: '#/components/schemas/creditorName'
    vopPartyAccount:
      description: The IBAN of the account.
      type: object
      required:
        - iban
      properties:
        iban:
          $ref: '#/components/schemas/iban'
    vopPartyAgent:
      $ref: '#/components/schemas/bicfi'
    verificationOfPayee_json:
      title: Verification of Payee
      description: >
        Request Body for a Verification of Payee via JSON.
      type: object
      required:
        - party
        - partyAccount
      properties:
        party:
          $ref: '#/components/schemas/vopParty'
        partyAccount:
          $ref: '#/components/schemas/vopPartyAccount'
        partyAgent:
          $ref: '#/components/schemas/vopPartyAgent'
    bulkVerificationOfPayee_json: 
      title: Bulk Verification of Payee
      description: >
        Request Body for a Bulk Verification of Payee via JSON.
      type: object
      required:
        - partyVerificationRequests
      properties:
        partyVerificationRequests:
          type: array
          items:
            allOf:
              - type: object
                required:
                  - uetr
                  - party
                  - partyAccount
                properties:
                  uetr:
                    description: Unique reference identifying the party verification request.
                    type: string
                    format: uuid
                  party:
                    $ref: '#/components/schemas/vopParty'
                  partyAccount:
                    $ref: '#/components/schemas/vopPartyAccount'
                  partyAgent:
                    $ref: '#/components/schemas/vopPartyAgent'
    verificationOfPayeeResponse:
      description: >
        Body of the JSON response for a successful VoP request.
      type: object
      required:
        - partyNameMatch
      properties:
        partyNameMatch:
          description: >
            The match result of the VoP request in a 4-letter code. See Statues & Types documentation for full descriptions of status codes.
          type: string
          enum:
            - MTCH
            - CMTC
            - NMTC
            - NOAP
        matchedName:
          description: >
            The actual name found for the account. This is returned in case of a slight mismatch with the name provided in the request. 
          type: string
        tppMessages:
          type: array
          items:
            $ref: '#/components/schemas/tppMessage200_VoP'
    bulkVerificationOfPayeeResponse:
      description: >
        Body of the JSON response for a successful bulk VoP request.
      type: object
      required:
        - partyVerificationResponses
      properties:
        partyVerificationResponses:
          type: array
          items:
            $ref: '#/components/schemas/bulkVerificationOfPayeeResponseItem'
    bulkVerificationOfPayeeResponseItem:
      allOf:
        - type: object
          required:
            - uetr
