          $ref: '#/components/schemas/pan'
        maskedPan:
          $ref: '#/components/schemas/maskedPan'
        msisdn:
          $ref: '#/components/schemas/msisdn'
        currency:
          $ref: '#/components/schemas/currencyCode'
        bankGiro:
          $ref: '#/components/schemas/bankGiroNumber'
        plusGiro:
          $ref: '#/components/schemas/plusGiroNumber'
    giroReference:
      description: |
        Reference to a Swedish Bankgiro or Plusgiro account
      type: object
      required:
        - giroNumber
        - giroType
      properties:
        giroNumber:
          $ref: '#/components/schemas/giroNumber'
        giroType:
          $ref: '#/components/schemas/giroType'
    giroInvoiceReference:
      type: string
      description: Custom invoice reference
      minLength: 1
      maxLength: 25
      example: 'INV-20250073'
    sepaInvoiceReference:
      type: string
      description: Custom invoice reference
      minLength: 1
      maxLength: 35
      example: '86851625960015'
    giroOcrReference:
      type: string
      description: Swedish OCR reference.
      minLength: 2
      maxLength: 25
      pattern: '^[0-9]+$'
      example: '45678901234567'
    sepaOcrReference:
      type: string
      description: RF creditor reference.
      minLength: 5
      maxLength: 25
      pattern: 'RF[0-9]{2}[A-Z0-9]+$'
      example: 'RF18539007547034'
    balanceType:
      description: |
        The type of balance represented. See Statuses & Types documentation for full descriptions of balance types.
      type: string
      enum:
        - closingBooked
        - expected
        - authorised
        - openingBooked
        - interimAvailable
        - interimBooked
        - forwardAvailable
        - nonInvoiced
        - valueDated
        - interimCleared
        - closingAvailable
        - closingCleared
        - openingAvailable
        - openingCleared
        - information
    accountAccess:
      description: |
        Requested access services for a consent.
      type: object
      properties:
        accounts:
          description: >
            Asks for detailed account information. If the array is empty, the TPP asks for an accessible account list, and the arrays for balances and transactions will also be empty.
          type: array
          items:
            $ref: '#/components/schemas/accountReference'
        balances:
          description: >
            Asks for balances of the addressed accounts. If the array is empty, the TPP asks for the balances of all accessible accounts, and the arrays for accounts and transactions will also be empty. 
          type: array
          items:
            $ref: '#/components/schemas/accountReference'
        transactions:
          description: >
            Asks for transactions on the addressed accounts. If the array is empty, the TPP asks for the transactions of all accessible accounts and the arrays for accounts and balances will also be empty.
          type: array
          items:
            $ref: '#/components/schemas/accountReference'
        availableAccounts:
          description: >
            Optional if supported by API provider. Only the values "allAccounts", "allAccountsWithBalances" or "selectAccounts" are allowed.
          type: string
          enum:
            - allAccounts
            - allAccountsWithBalances
            - selectAccounts
        allPsd2:
          description: |
            Optional if supported by API provider. Only the value "allAccounts" is allowed.
          type: string
          enum:
            - allAccounts
    cashAccountType:
      description: |
        ExternalCashAccountType1Code from ISO 20022.
      type: string
    accountStatus:
      description: >
        Account status. The value is one of the following:
          - "enabled": account is available
          - "deleted": account is terminated
          - "blocked": account is blocked e.g. for legal reasons
        If this field is not used, than the account is available in the sense of
        this specification.
      type: string
      enum:
        - enabled
        - deleted
        - blocked
    accountDetails:
      description: >
        The ASPSP shall give at least one of the account reference identifiers:
          - iban
          - bban
          - pan
          - maskedPan
          - msisdn
        If the account is a multicurrency account currency code in "currency" is
        set to "XXX".
      type: object
      required:
        - currency
      properties:
        resourceId:
          description: >-
            This shall be filled, if addressable resource are created by the
            ASPSP on the /accounts or /card-accounts endpoint.
          type: string
        iban:
          $ref: '#/components/schemas/iban'
        bban:
          $ref: '#/components/schemas/bban'
        clearingNumber:
          $ref: '#/components/schemas/clearingNumber'
        accountNumber:
          $ref: '#/components/schemas/accountNumber'
        msisdn:
          $ref: '#/components/schemas/msisdn'
        bankgiroNumber:
          $ref: '#/components/schemas/bankGiroNumber'
        plusgiroNumber:
          $ref: '#/components/schemas/plusGiroNumber'
        currency:
          $ref: '#/components/schemas/currencyCode'
        name:
          description: Name of the account given by the bank or the PSU in online-banking.
          type: string
          maxLength: 35
        product:
          description: Product name of the bank for this account, proprietary definition.
          type: string
          maxLength: 35
        cashAccountType:
          $ref: '#/components/schemas/cashAccountType'
        status:
          $ref: '#/components/schemas/accountStatus'
        bic:
          $ref: '#/components/schemas/bicfi'
        linkedAccounts:
          description: >-
            Case of a set of pending card transactions, the APSP will provide
            the relevant cash account the card is set up on.
          type: string
          maxLength: 70
        usage:
          description: |
            Specifies the usage of the account:
              * PRIV: private personal account.
              * ORGA: professional account.
          type: string
          maxLength: 4
          enum:
            - PRIV
            - ORGA
        details:
          description: |
            Specifications that might be provided by the ASPSP:
              - characteristics of the account.
              - characteristics of the relevant card.
          type: string
          maxLength: 140
        creditLimit:
          $ref: '#/components/schemas/creditLimit'
        balances:
          $ref: '#/components/schemas/balanceList'
        _links:
          $ref: '#/components/schemas/_linksAccountDetails'
        ownerName:
          description: >
            Name of the legal account owner. If there is more than one owner, then multiple names might be noted here. For a corporate account, the corporate name is used for this attribute. Even if supported by the ASPSP, the provision of this field might depend on the fact whether an explicit consent to this specific additional account information has been given by the PSU.
          type: string
          maxLength: 140
          example: John Doe
        lastTransactionEnrichmentDateTime:
